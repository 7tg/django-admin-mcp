name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version from pyproject.toml
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "Publishing version $VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Wait for PyPI to serve this version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          for i in $(seq 1 30); do
            if curl -s "https://pypi.org/pypi/django-admin-mcp/$VERSION/json" | grep -q '"version"'; then
              echo "PyPI serves $VERSION"; exit 0
            fi
            echo "waiting for PyPI ($i)..."; sleep 20
          done
          echo "PyPI never served $VERSION" >&2; exit 1

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
