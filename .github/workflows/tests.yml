name: Tests

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['3.2', '4.0', '4.1', '4.2', '5.0', '5.1', '5.2', '6.0']
        exclude:
          # Django 6.0 needs Python 3.12 or newer.
          - { python-version: '3.10', django-version: '6.0' }
          - { python-version: '3.11', django-version: '6.0' }
          # Django releases before 5.1 do not support Python 3.13 or newer.
          - { python-version: '3.13', django-version: '3.2' }
          - { python-version: '3.13', django-version: '4.0' }
          - { python-version: '3.13', django-version: '4.1' }
          - { python-version: '3.13', django-version: '4.2' }
          - { python-version: '3.13', django-version: '5.0' }
          # Only Django 6.0 supports Python 3.14.
          - { python-version: '3.14', django-version: '3.2' }
          - { python-version: '3.14', django-version: '4.0' }
          - { python-version: '3.14', django-version: '4.1' }
          - { python-version: '3.14', django-version: '4.2' }
          - { python-version: '3.14', django-version: '5.0' }
          - { python-version: '3.14', django-version: '5.1' }
          - { python-version: '3.14', django-version: '5.2' }

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras
        uv pip install Django==${{ matrix.django-version }}.*

    - name: Run pytest
      run: |
        uv run pytest --cov=django_admin_mcp --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Check formatting with ruff
      run: uv run ruff format --check .

    - name: Type check with mypy
      run: uv run mypy django_admin_mcp/
